syntax = "proto3";

package plcmonitor;

// ═══════════════════════════════════════════════════════════════
// PLC Variable Monitor — Protocol Buffer Definitions
// ═══════════════════════════════════════════════════════════════

// ── Variable value (tagged union) ───────────────────────────────
message VarValue {
  uint32 var_id = 1;            // Index in the variable registry
  oneof value {
    bool   bool_val   = 2;
    int32  int_val    = 3;      // INT, SINT, USINT
    uint32 uint_val   = 4;      // UINT, UDINT
    int64  dint_val   = 5;      // DINT
    float  real_val   = 6;      // REAL
    double lreal_val  = 7;      // LREAL
    string string_val = 8;      // STRING
  }
}

// ── PLC → Python: variable update packet ────────────────────────
message VarUpdatePacket {
  uint32 sequence    = 1;       // Packet sequence number
  uint64 timestamp   = 2;       // PLC timestamp (microseconds)
  repeated VarValue values = 3; // Changed/subscribed variable values
}

// ── Python → PLC: subscription command ──────────────────────────
message SubscribeCommand {
  enum Action {
    SET = 0;                    // Replace entire subscription list
    ADD = 1;                    // Add to current subscription
    REMOVE = 2;                 // Remove from current subscription
  }
  Action action = 1;
  repeated uint32 var_ids = 2;  // Variable indices to subscribe to
  uint32 interval_ms = 3;      // Desired update interval (ms)
}

// ── Python → PLC: request variable registry ─────────────────────
message RegistryRequest {
  bool full_registry = 1;       // Request full variable list from PLC
}

// ── PLC → Python: variable registry entry ───────────────────────
message VarRegistryEntry {
  uint32 var_id = 1;
  string name   = 2;           // Full path: "gExitCtrl.In.Cmd.Stop"
  string plc_type = 3;         // "BOOL", "REAL", etc.
}

message VarRegistryResponse {
  repeated VarRegistryEntry entries = 1;
}

// ── Wrapper for TCP framing ─────────────────────────────────────
message PlcMessage {
  enum MsgType {
    VAR_UPDATE       = 0;
    SUBSCRIBE_CMD    = 1;
    REGISTRY_REQUEST = 2;
    REGISTRY_RESPONSE = 3;
    HEARTBEAT        = 4;
  }
  MsgType type = 1;
  oneof payload {
    VarUpdatePacket     update   = 2;
    SubscribeCommand    subscribe = 3;
    RegistryRequest     reg_req  = 4;
    VarRegistryResponse reg_resp = 5;
  }
}
